<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>자모냥</title>
  <meta name="description" content="한글 자음·모음으로 만드는 슬라이딩 블록 퍼즐" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 타이틀 / 레벨 선택 -->
    <section id="menu" class="screen">
      <header class="title">
        <h1>자모냥</h1>
        <p>모음 블록을 밀어서 같은 색 자음을 만나면 글자가 돼요</p>
      </header>
      <div id="worlds"></div>
      <details class="legend">
        <summary>보호자용 · 색 규칙 (훈민정음 오음)</summary>
        <ul id="legendList"></ul>
        <p class="small">세로 모음(ㅣㅏㅓㅑㅕ)은 위아래로, 가로 모음(ㅡㅗㅜㅛㅠ)은 옆으로만 움직여요. 자음이나 모음을 누르면 이름을 읽어 줘요.</p>
      </details>
    </section>

    <!-- 게임 화면 -->
    <section id="game" class="screen hidden">
      <div class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="단계 고르기로">←</button>
        <div class="level-title">
          <span id="worldName"></span>
          <strong id="levelName"></strong>
        </div>
        <button id="restartBtn" class="icon-btn" aria-label="처음부터">↻</button>
        <button id="soundBtn" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </div>
      <button id="target" class="target" aria-label="단어 듣기">
        <span id="targetEmoji" class="emoji"></span>
        <span id="targetSlots" class="slots"></span>
      </button>
      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div id="toast" class="toast"></div>
      </div>
      <p id="tip" class="tip"></p>
      <div class="helpers">
        <button id="undoBtn" class="helper">↩<span>되돌리기</span></button>
        <button id="hintBtn" class="helper">💡<span>힌트</span></button>
        <button id="tipBtn" class="helper">🗣️<span>다시 듣기</span></button>
      </div>
    </section>

    <!-- 결과 -->
    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="resultTitle"></h2>
        <div id="resultStars" class="stars"></div>
        <div id="resultBody"></div>
        <div class="card-actions">
          <button id="resultRetry" class="btn ghost">한 번 더</button>
          <button id="resultNext" class="btn">다음 단계</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/hangul.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
